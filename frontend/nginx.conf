# Access log without query strings: search terms and old-style ?token= links
# carry names and secrets that do not belong in logs. ($request includes
# $args; $uri is the path alone.) log_format is an http-level directive, so
# it lives outside the server block.
log_format no_args '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the version in Server headers or error pages.
    server_tokens off;

    access_log /var/log/nginx/access.log no_args;

    # Reject oversized bodies at the edge. Default is 1m.
    client_max_body_size 25M;

    # Give slow clients time to send a large body without
    # tying up a worker indefinitely. Default is 60s.
    client_body_timeout 300s;

    # Security headers. add_header is inherited by the locations below only
    # while none of them declares its own add_header — if one ever does,
    # repeat these there. `always` puts them on error responses too.
    #
    # CSP suits this build: Vite emits external module scripts and one
    # stylesheet (no inline script, so no nonces needed); the favicon is a
    # data: SVG; React's style={{...}} props are set via CSSOM, which CSP
    # does not restrict. If the image is ever built with a cross-origin
    # VITE_API_BASE, add that origin to connect-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Ignored by browsers over plain HTTP; takes effect when TLS terminates
    # upstream and this container serves the same responses.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API
    location /api/ {
        proxy_pass http://api:8000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
