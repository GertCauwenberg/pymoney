version: 2
updates:
  # Pinned action majors still need patch bumps; this is the cheapest supply
  # chain hygiene available.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(server)"
    groups:
      dev-tools:
        patterns: ["ruff", "mypy", "pytest*", "hypothesis", "coverage"]

  - package-ecosystem: pip
    directory: /desktop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(desktop)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(frontend)"

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "docker(server)"

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "docker(frontend)"
