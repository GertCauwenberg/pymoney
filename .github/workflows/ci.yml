name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # The core has no runtime dependencies, but the dev tools do. A weekly run
  # catches a new ruff/mypy/hypothesis release breaking us before a contributor
  # hits it on an unrelated pull request.
  schedule:
    - cron: "17 5 * * 1"

# Superseded runs on the same branch are pointless; cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - name: ruff check
        run: ruff check --output-format=github src tests
      - name: ruff format
        run: ruff format --check --diff src tests

  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: mypy

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'

      # The `ci` Hypothesis profile runs ~10x the examples of local dev and is
      # derandomised, so a failure on CI is reproducible from the same seed.
      - name: pytest
        run: >
          pytest
          --hypothesis-profile=ci
          --cov=pymoney
          --cov-report=term-missing
          --cov-report=xml
          --junitxml=junit.xml

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Coverage (py${{ matrix.python-version }})"
            echo
            coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml
          retention-days: 14
          if-no-files-found: warn

  docker:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build the test stage and run the suite inside it: proves the image can
      # actually run what we ship, not just that it builds.
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: pymoney:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the suite in the image
        run: docker run --rm pymoney:test

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: pymoney:runtime
          cache-from: type=gha
      - name: Smoke test the runtime image
        run: docker run --rm pymoney:runtime

      - name: Validate compose file
        run: docker compose --env-file .env.example config --quiet

  # Single required check for branch protection, so the matrix can grow without
  # reconfiguring the repository settings.
  #
  # `if: always()` means this job runs even when a dependency fails, so it must
  # fail explicitly -- hence the result check rather than an implicit pass.
  # `skipped` and `cancelled` count as failures too: a required check that goes
  # green because a job never ran is worse than no check at all.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint, types, test, docker]
    if: always()
    steps:
      - name: Fail if any job did not succeed
        if: >-
          ${{ contains(needs.*.result, 'failure')
           || contains(needs.*.result, 'cancelled')
           || contains(needs.*.result, 'skipped') }}
        run: |
          echo "Upstream results: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - name: All green
        run: |
          echo "Upstream results: ${{ join(needs.*.result, ', ') }}"
