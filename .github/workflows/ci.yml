name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # The core has no runtime dependencies, but the dev tools do. A weekly run
  # catches a new ruff/mypy/hypothesis release breaking us before a contributor
  # hits it on an unrelated pull request.
  schedule:
    - cron: "17 5 * * 1"

# Superseded runs on the same branch are pointless; cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - name: ruff check
        run: ruff check --output-format=github src tests
      - name: ruff format
        run: ruff format --check --diff src tests

      # The OpenAPI document is part of the contract we ship, so a changed
      # endpoint must come with a regenerated spec. A client generated from the
      # committed document is then never wrong about the server.
      - name: OpenAPI document is up to date
        run: |
          python scripts/openapi.py
          git diff --exit-code docs/openapi.json \
            || { echo "::error::docs/openapi.json is stale; run 'make openapi'"; exit 1; }

  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: mypy

  # Memory and SQLite need no services, so this job stays fast and carries the
  # coverage gate. PostgreSQL gets its own job below.
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Qt runtime libraries (the desktop tests run PySide6 offscreen)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      # The `ci` Hypothesis profile runs ~10x the examples of local dev and is
      # derandomised, so a failure on CI is reproducible from the same seed.
      - name: pytest
        run: >
          pytest
          --hypothesis-profile=ci
          --stores=memory,sqlite,sqlite-file
          -k "not postgres"
          --cov=src/pymoney
          --cov-report=term-missing
          --cov-report=xml
          --junitxml=junit.xml

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Coverage (py${{ matrix.python-version }})"
            echo
            coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml
          retention-days: 14
          if-no-files-found: warn

  # The same suite again, against a real PostgreSQL. Separate because it needs a
  # service container and takes minutes rather than seconds: a contributor
  # editing the domain should not wait for it to find a typo.
  postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pymoney_test
          POSTGRES_USER: pymoney
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pymoney -d pymoney_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYMONEY_TEST_DATABASE_URL: >-
        postgresql+psycopg://pymoney:ci-only-not-a-secret@localhost:5432/pymoney_test
      # Makes the suite fail, rather than skip, if PostgreSQL is unreachable.
      # Silently falling back to SQLite is the failure mode this whole job exists
      # to prevent.
      PYMONEY_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: sudo apt-get install -y libegl1 libgl1

      - name: Confirm PostgreSQL is really being used
        run: pytest tests/test_store.py::test_postgres_is_actually_exercised -q

      - name: Migrations apply cleanly
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
        env:
          PYMONEY_DATABASE_URL: ${{ env.PYMONEY_TEST_DATABASE_URL }}

      - name: pytest (PostgreSQL backend)
        run: pytest --hypothesis-profile=ci --stores=postgres

      - name: Store and performance suites
        run: pytest tests/test_store.py tests/test_performance.py --stores=memory

  docker:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build the test stage and run the suite inside it: proves the image can
      # actually run what we ship, not just that it builds.
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: pymoney:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the suite in the image
        run: docker run --rm pymoney:test

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: pymoney:runtime
          cache-from: type=gha
      - name: Smoke test the runtime image
        run: docker run --rm pymoney:runtime

      - name: Validate compose file
        run: docker compose --env-file .env.example config --quiet

  # The web frontend. `npm run check` regenerates the API types from
  # docs/openapi.json and fails if they differ from what is committed, so a
  # server change that alters the contract cannot land without the client
  # noticing; then typecheck, tests, and a production build.
  web:
    name: Web frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend

  # The browser walkthroughs: Playwright starts the API (from this checkout's
  # Python environment) and the Vite dev server, then drives Chromium through
  # registering, sharing, posting and editing. Slower than the rest, so a job of
  # its own; a failure leaves a trace and an HTML report as an artifact.
  e2e:
    name: End-to-end (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m venv .venv && .venv/bin/pip install -e '.[dev]'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run e2e:install
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
        env:
          CI: "1"
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/e2e/report
            frontend/e2e/test-results
          retention-days: 7

  # Single required check for branch protection, so the matrix can grow without
  # reconfiguring the repository settings.
  #
  # `if: always()` means this job runs even when a dependency fails, so it must
  # fail explicitly -- hence the result check rather than an implicit pass.
  # `skipped` and `cancelled` count as failures too: a required check that goes
  # green because a job never ran is worse than no check at all.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint, types, test, postgres, docker, web, e2e]
    if: always()
    steps:
      - name: Fail if any job did not succeed
        if: >-
          ${{ contains(needs.*.result, 'failure')
           || contains(needs.*.result, 'cancelled')
           || contains(needs.*.result, 'skipped') }}
        run: |
          echo "Upstream results: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - name: All green
        run: |
          echo "Upstream results: ${{ join(needs.*.result, ', ') }}"
