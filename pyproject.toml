[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pymoney-core"
version = "0.1.0"
description = "Core double-entry accounting domain model for PyMoney"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["pymoney"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # long lines in prose/docstrings are fine
    "UP017",   # datetime.UTC is 3.11+; timezone.utc reads clearer to most
    "RUF012",  # ClassVar annotations on mutable class attrs
    "B008",    # call-in-default is deliberate in a couple of test helpers
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]
