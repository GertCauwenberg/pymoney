[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pymoney-core"
version = "0.1.0"
description = "Core double-entry accounting domain model for PyMoney"
readme = "README.md"
requires-python = ">=3.12"
license-files = ["LICENSE"]
authors = [{ name = "Gert Cauwenberg" }]
keywords = ["accounting", "double-entry", "finance", "ledger", "multi-currency"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Typing :: Typed",
]
# The core deliberately has no runtime dependencies: it is pure stdlib, so it
# can be embedded anywhere (server, desktop, a script) without pulling a stack in.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "pytest-cov>=5", "ruff>=0.16", "mypy>=2.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Put the project root on sys.path explicitly, so `from tests.conftest import
# Chart` resolves no matter which directory pytest is invoked from (the
# container runs it from /home/pymoney).
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["pymoney"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # long lines in prose/docstrings are fine
    "UP017",   # datetime.UTC is 3.11+; timezone.utc reads clearer to most
    "RUF012",  # ClassVar annotations on mutable class attrs
    "B008",    # call-in-default is deliberate in a couple of test helpers
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
files = ["src/pymoney"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true
