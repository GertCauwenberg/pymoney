[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pymoney-core"
version = "0.1.0"
description = "Core double-entry accounting domain model for PyMoney"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
authors = [{ name = "Gert Cauwenberg" }]
keywords = ["accounting", "double-entry", "finance", "ledger", "multi-currency"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Typing :: Typed",
]
# pymoney.core deliberately has no runtime dependencies: it is pure stdlib, so it
# can be embedded anywhere (server, desktop, a script) without pulling a stack in.
# Persistence is an extra, so a client that only needs the domain model does not
# drag SQLAlchemy along.
dependencies = []

[project.optional-dependencies]
store = ["sqlalchemy>=2.0.30", "alembic>=1.13"]
api = [
    "pymoney-core[store]",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.30",
    # File uploads (the KMyMoney import endpoint).
    "python-multipart>=0.0.9",
]
postgres = ["psycopg[binary]>=3.1", "psycopg2-binary>=2.9"]
desktop = [
    # The PySide6 client. pydantic for the wire schemas it shares with the API.
    "pymoney-core[store]",
    "pydantic>=2.9",
    "PySide6>=6.6",
]
local = [
    # Starts a throwaway PostgreSQL server, so the PostgreSQL suite runs
    # without Docker. CI uses a real service container instead.
    "pgserver",
]
dev = [
    "pymoney-core[store,postgres,api,desktop]",
    "pytest-qt>=4.4",
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The Mako template is needed by `alembic revision`, so it has to ship: an
# installed PyMoney must be able to generate migrations, not just apply them.
"pymoney.store.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Put the project root on sys.path explicitly, so `from tests.conftest import
# Chart` resolves no matter which directory pytest is invoked from (the
# container runs it from /home/pymoney).
pythonpath = ["."]
filterwarnings = [
    "error",
    # starlette.testclient warns that httpx2 exists. It does not, yet, on PyPI.
    "ignore:Using `httpx` with `starlette.testclient`:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
branch = true
# The source *path*, not the package name. Alembic executes migrations/env.py
# with exec(), and coverage only attributes that file correctly when the measured
# source is a path.
source = ["src/pymoney"]

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # long lines in prose/docstrings are fine
    "UP017",   # datetime.UTC is 3.11+; timezone.utc reads clearer to most
    "RUF012",  # ClassVar annotations on mutable class attrs
    "B008",    # call-in-default is deliberate in a couple of test helpers
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]
# Autogenerated by Alembic, then reviewed by hand; not hand-formatted.
"src/pymoney/store/migrations/versions/*" = ["E501"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
files = ["src/pymoney"]
# Migration scripts are generated by `alembic revision --autogenerate` and then
# reviewed; type-checking the generated DDL calls buys nothing.
exclude = "src/pymoney/store/migrations/versions/"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true
