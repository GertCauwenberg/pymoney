# PyMoney local stack.
#
#   cp .env.example .env          # then edit the password
#   docker compose up -d                                      # PostgreSQL
#   docker compose --profile api run --rm api python -m pymoney.store.migrate
#   docker compose --profile api up -d                        # the HTTP API on :8000
#   docker compose --profile test run --rm tests
#
# Profiles keep the default `up` to the database alone: the API is opt-in, and
# so is the test run. The API image is built from ./server, the web image from
# ./frontend (see compose-production.yaml); each component deploys on its own.
name: pymoney

x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:-pymoney}
  POSTGRES_USER: ${POSTGRES_USER:-pymoney}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-pymoney_test}

services:
  # The store layer has to pass the same test suite against PostgreSQL as
  # against SQLite, and the API runs on it in production.
  db:
    image: postgres:17-alpine
    environment: *postgres-env
    # Bound to loopback on purpose. A development database must not be
    # reachable from the network just because someone ran `compose up`.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # The suite, run inside the image that would be shipped, against all three
  # storage backends including the `db` service.
  tests:
    build:
      context: ./server
      target: test
    profiles: [test]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PYMONEY_TEST_DATABASE_URL: >-
        postgresql+psycopg2://${POSTGRES_USER:-pymoney}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_TEST_DB:-pymoney_test}
      PYMONEY_REQUIRE_POSTGRES: "1"
      HYPOTHESIS_STORAGE_DIRECTORY: /tmp/hypothesis
    security_opt:
      - no-new-privileges:true
    command:
      - pytest
      - --hypothesis-profile=ci
      - --stores=memory,sqlite,postgres
      - --cov=src/pymoney
      - --cov-report=term-missing

  # The HTTP API. Migrations are not run automatically: applying schema changes
  # on container start is how two replicas race each other. Run them as a step
  # of the deployment, from the same image, against the same database:
  #     docker compose --profile api run --rm api python -m pymoney.store.migrate
  # (`alembic upgrade head` needs the repository's alembic.ini and does not work
  # inside the image.)
  #
  # Registration is closed by default. Create the first user with it open, or
  # import a book and grant access from the command line:
  #     docker compose --profile api run --rm api \
  #         python -m pymoney.store.grants BOOK_ID you@example.org owner
  api:
    build:
      context: ./server
      target: runtime
    profiles: [api]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PYMONEY_DATABASE_URL: >-
        postgresql+psycopg2://${POSTGRES_USER:-pymoney}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pymoney}
      # Behind a TLS-terminating proxy, keep this on: it marks the session
      # cookie Secure. Turn it off only for plain-HTTP local work.
      PYMONEY_COOKIE_SECURE: ${PYMONEY_COOKIE_SECURE:-true}
      PYMONEY_ALLOW_REGISTRATION: ${PYMONEY_ALLOW_REGISTRATION:-false}
      PYMONEY_CORS_ORIGINS: ${PYMONEY_CORS_ORIGINS:-[]}
      # Quote fetching: how often (minutes; 0 turns the scheduler off) and any
      # extra providers as module:Class references.
      PYMONEY_QUOTE_INTERVAL_MINUTES: ${PYMONEY_QUOTE_INTERVAL_MINUTES:-360}
      PYMONEY_QUOTE_PLUGINS: ${PYMONEY_QUOTE_PLUGINS:-[]}
      # Activation and password-reset emails. Without an SMTP host the links
      # land in the container log (and the server warns at startup).
      PYMONEY_REQUIRE_ACTIVATION: ${PYMONEY_REQUIRE_ACTIVATION:-true}
      PYMONEY_PUBLIC_URL: ${PYMONEY_PUBLIC_URL:-http://localhost:5173}
      PYMONEY_MAIL_BACKEND: ${PYMONEY_MAIL_BACKEND:-console}
      PYMONEY_MAIL_FROM: ${PYMONEY_MAIL_FROM:-pymoney@localhost}
      PYMONEY_SMTP_HOST: ${PYMONEY_SMTP_HOST:-}
      PYMONEY_SMTP_PORT: ${PYMONEY_SMTP_PORT:-587}
      PYMONEY_SMTP_USERNAME: ${PYMONEY_SMTP_USERNAME:-}
      PYMONEY_SMTP_PASSWORD: ${PYMONEY_SMTP_PASSWORD:-}
      # Uploaded receipts and invoices. The bytes live here, not in the
      # database, so this must be the mounted volume below (the image's own
      # filesystem is read-only and ephemeral). Back it up alongside the
      # database dump; see README "Backups".
      PYMONEY_ATTACHMENTS_DIR: /var/lib/pymoney/attachments
      PYMONEY_MAX_ATTACHMENT_MB: ${PYMONEY_MAX_ATTACHMENT_MB:-25}
    ports:
      - "127.0.0.1:${PYMONEY_API_PORT:-8000}:8000"
    volumes:
      - attachments:/var/lib/pymoney/attachments
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          with urllib.request.urlopen("http://localhost:8000/health") as r:
              sys.exit(0 if r.status == 200 else 1)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    # The image filesystem stays read-only; only the attachments volume and a
    # tmpfs scratch are writable.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # One worker, on purpose: a book's caches and its per-book lock live in the
    # process (decision #14), so a second worker would write behind the first's
    # back. PYMONEY_LOG_LEVEL is uvicorn's, substituted here rather than read by
    # the application, which has no setting of that name.
    command:
      - uvicorn
      - "pymoney.api:app"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --log-level
      - "${PYMONEY_LOG_LEVEL:-info}"

volumes:
  pgdata:
  # Receipt/invoice blobs. A named volume, so `docker compose down` (without
  # -v) and a container rebuild both keep it. It is *not* in the database
  # dump -- back the two up together.
  attachments:
