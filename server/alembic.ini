# Alembic configuration.
#
#   alembic upgrade head
#   alembic revision --autogenerate -m "what changed"
#
# The URL is deliberately not set here. It comes from $PYMONEY_DATABASE_URL (see
# migrations/env.py), so a connection string never lands in the repository and
# the same config works for SQLite and PostgreSQL.
[alembic]
script_location = src/pymoney/store/migrations
prepend_sys_path = src
path_separator = os
# Timestamped, ordered filenames: a migration's age is the first thing you want
# to know when reading the directory.
file_template = %%(year)04d%%(month)02d%%(day)02d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
